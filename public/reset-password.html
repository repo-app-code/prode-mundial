<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña – Prode Mundial 2026</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">⚽</div>
        <h1>Prode Mundial 2026</h1>
        <p>Ingresá tu nueva contraseña</p>
      </div>

      <div id="alert" class="alert hidden"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="password">Nueva contraseña</label>
          <input class="form-control" type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="password2">Confirmar contraseña</label>
          <input class="form-control" type="password" id="password2" placeholder="Repetí la contraseña" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
          Guardar nueva contraseña
        </button>
      </form>

      <div class="auth-footer" id="footer-link" style="display:none;">
        <a href="/login.html">Ir al login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) window.location.href = '/login.html';

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl  = document.getElementById('alert');
      const password  = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      alertEl.className = 'alert hidden';

      if (password !== password2) {
        alertEl.textContent = 'Las contraseñas no coinciden';
        alertEl.className   = 'alert alert-danger';
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando...';

      try {
        await api.post('/auth/reset-password', { token, password });
        alertEl.textContent = '✅ Contraseña actualizada. Ya podés iniciar sesión.';
        alertEl.className   = 'alert alert-success';
        document.getElementById('reset-form').style.display = 'none';
        document.getElementById('footer-link').style.display = 'block';
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className   = 'alert alert-danger';
        btn.disabled    = false;
        btn.textContent = 'Guardar nueva contraseña';
      }
    });
  </script>
</body>
</html>
