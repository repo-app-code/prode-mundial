<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña – Prode Mundial 2026</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">⚽</div>
        <h1>Prode Mundial 2026</h1>
        <p>Ingresá tu email y te mandamos un link para resetear tu contraseña</p>
      </div>

      <div id="alert" class="alert hidden"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
          Enviar link
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">← Volver al login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn     = document.getElementById('submit-btn');
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert hidden';
      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span> Enviando...';

      try {
        await api.post('/auth/forgot-password', {
          email: document.getElementById('email').value,
        });
        alertEl.textContent = '✅ Si el email está registrado, vas a recibir el link en los próximos minutos.';
        alertEl.className   = 'alert alert-success';
        document.getElementById('forgot-form').reset();
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className   = 'alert alert-danger';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Enviar link';
      }
    });
  </script>
</body>
</html>
