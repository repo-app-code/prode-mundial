<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse – Prode Mundial 2026</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">⚽</div>
        <h1>Crear cuenta</h1>
        <p>Unite al Prode del Mundial 2026</p>
      </div>

      <div id="alert" class="alert hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="username">Nombre de usuario</label>
          <input class="form-control" type="text" id="username" placeholder="tuusuario" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
          Crear cuenta
        </button>
      </form>

      <div class="auth-footer">
        ¿Ya tenés cuenta? <a href="/login.html">Iniciá sesión</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert hidden';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creando cuenta...';

      try {
        const data = await api.post('/auth/register', {
          username: document.getElementById('username').value,
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className = 'alert alert-danger';
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
