<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – Prode Mundial 2026</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav>
    <a class="nav-brand" href="/dashboard.html">⚽ Prode Mundial 2026</a>
    <div id="nav-links" class="nav-links"></div>
    <div class="nav-user">
      Hola, <span id="nav-username"></span>
      <button id="btn-logout" class="btn btn-ghost btn-sm">Salir</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-title">🏠 Dashboard</div>

    <div id="stats-grid" class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon yellow">⭐</div>
        <div>
          <div class="stat-value" id="stat-points">—</div>
          <div class="stat-label">Puntos totales</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">🏅</div>
        <div>
          <div class="stat-value" id="stat-rank">—</div>
          <div class="stat-label">Posición global</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div>
          <div class="stat-value" id="stat-preds">—</div>
          <div class="stat-label">Pronósticos cargados</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">🎯</div>
        <div>
          <div class="stat-value" id="stat-exact">—</div>
          <div class="stat-label">Resultados exactos</div>
        </div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
      <div class="card">
        <div class="card-header">
          📅 Próximos partidos
          <a href="/matches.html" class="btn btn-ghost btn-sm">Ver todos</a>
        </div>
        <div class="card-body" id="upcoming-matches">
          <div class="empty-state"><span class="spinner"></span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          🏆 Ranking global (Top 10)
          <a href="/matches.html#ranking" class="btn btn-ghost btn-sm">Completo</a>
        </div>
        <div class="card-body" id="global-ranking">
          <div class="empty-state"><span class="spinner"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/pages/dashboard.js"></script>
</body>
</html>
